openapi: 3.0.3
info:
  title: CLEVER Announcement Registry API
  version: 1.0.0
  description: Service-owned OpenAPI schema for service-announcement-registry.
paths:
  /:
    get:
      operationId: root_list
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
          description: ''
    post:
      operationId: root_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Announcement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Announcement'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /{announcement_id}/:
    get:
      operationId: root_retrieve
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: string
          format: uuid
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    patch:
      operationId: root_partial_update
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: string
          format: uuid
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncement'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    Announcement:
      type: object
      properties:
        announcement_id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 96
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        body:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        exposure_scope:
          $ref: '#/components/schemas/ExposureScopeEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_pinned:
          type: boolean
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - announcement_id
      - body
      - created_at
      - exposure_scope
      - slug
      - status
      - title
      - updated_at
    ExposureScopeEnum:
      enum:
      - all
      - driver
      - operator
      type: string
      description: |-
        * `all` - all
        * `driver` - driver
        * `operator` - operator
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    PatchedAnnouncement:
      type: object
      properties:
        announcement_id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 96
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        body:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        exposure_scope:
          $ref: '#/components/schemas/ExposureScopeEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_pinned:
          type: boolean
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    StatusEnum:
      enum:
      - draft
      - published
      - archived
      type: string
      description: |-
        * `draft` - draft
        * `published` - published
        * `archived` - archived
