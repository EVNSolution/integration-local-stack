openapi: 3.0.3
info:
  title: CLEVER Account Access API
  version: 1.0.0
  description: Service-owned OpenAPI schema for service-account-access.
paths:
  /driver-account-links/:
    get:
      operationId: driver_account_links_list
      tags:
      - driver-account-links
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverAccountLinkSummary'
          description: ''
    post:
      operationId: driver_account_links_create
      tags:
      - driver-account-links
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverAccountLinkCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriverAccountLinkCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverAccountLinkCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAccountLinkSummary'
          description: ''
  /driver-account-links/{link_id}/unlink/:
    post:
      operationId: driver_account_links_unlink_create
      parameters:
      - in: path
        name: link_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - driver-account-links
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAccountLinkSummary'
          description: ''
  /driver-accounts/manage/:
    get:
      operationId: driver_accounts_manage_retrieve
      tags:
      - driver-accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAccountList'
          description: ''
  /health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /identity-consent/:
    get:
      operationId: identity_consent_retrieve
      tags:
      - identity-consent
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityConsentCurrent'
          description: ''
  /identity-consent/recover/:
    post:
      operationId: identity_consent_recover_create
      tags:
      - identity-consent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityConsentRecover'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentityConsentRecover'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentityConsentRecover'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuthSession'
          description: ''
  /identity-consent/withdraw/:
    post:
      operationId: identity_consent_withdraw_create
      tags:
      - identity-consent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityConsentWithdraw'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentityConsentWithdraw'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentityConsentWithdraw'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuthSession'
          description: ''
  /identity-login/:
    post:
      operationId: identity_login_create
      tags:
      - identity-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentityLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentityLogin'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuthSession'
          description: ''
  /identity-login-methods/:
    get:
      operationId: identity_login_methods_retrieve
      tags:
      - identity-login-methods
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityLoginMethodList'
          description: ''
    post:
      operationId: identity_login_methods_create
      tags:
      - identity-login-methods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLoginMethodCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentityLoginMethodCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentityLoginMethodCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityLoginMethod'
          description: ''
  /identity-login-methods/{method_id}/delete/:
    post:
      operationId: identity_login_methods_delete_create
      parameters:
      - in: path
        name: method_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - identity-login-methods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLoginMethodDelete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentityLoginMethodDelete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentityLoginMethodDelete'
      responses:
        '204':
          description: No response body
  /identity-logout/:
    post:
      operationId: identity_logout_create
      tags:
      - identity-logout
      security:
      - {}
      responses:
        '204':
          description: No response body
  /identity-me/:
    get:
      operationId: identity_me_retrieve
      tags:
      - identity-me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuthSession'
          description: ''
  /identity-password/:
    put:
      operationId: identity_password_update
      tags:
      - identity-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentityPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentityPassword'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
          description: ''
  /identity-profile/:
    get:
      operationId: identity_profile_retrieve
      tags:
      - identity-profile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
          description: ''
    patch:
      operationId: identity_profile_partial_update
      tags:
      - identity-profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIdentityProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIdentityProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIdentityProfileUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
          description: ''
  /identity-recovery/:
    post:
      operationId: identity_recovery_create
      tags:
      - identity-recovery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRecovery'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentityRecovery'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentityRecovery'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuthSession'
          description: ''
  /identity-refresh/:
    post:
      operationId: identity_refresh_create
      tags:
      - identity-refresh
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuthSession'
          description: ''
  /identity-signup-requests/:
    post:
      operationId: identity_signup_requests_create
      tags:
      - identity-signup-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentitySignupIntake'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentitySignupIntake'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentitySignupIntake'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySignupIntakeResult'
          description: ''
  /identity-signup-requests/{request_id}/approve/:
    post:
      operationId: identity_signup_requests_approve_create
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - identity-signup-requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySignupRequestSummary'
          description: ''
  /identity-signup-requests/{request_id}/cancel/:
    post:
      operationId: identity_signup_requests_cancel_create
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - identity-signup-requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySignupRequestSummary'
          description: ''
  /identity-signup-requests/{request_id}/complete-setup/:
    post:
      operationId: identity_signup_requests_complete_setup_create
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - identity-signup-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequestSetup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequestSetup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequestSetup'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySignupRequestSummary'
          description: ''
  /identity-signup-requests/{request_id}/reject/:
    post:
      operationId: identity_signup_requests_reject_create
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - identity-signup-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequestAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequestAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequestAction'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySignupRequestSummary'
          description: ''
  /identity-signup-requests/manage/:
    get:
      operationId: identity_signup_requests_manage_retrieve
      tags:
      - identity-signup-requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupRequestList'
          description: ''
  /identity-signup-requests/me/:
    get:
      operationId: identity_signup_requests_me_retrieve
      tags:
      - identity-signup-requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupRequestList'
          description: ''
    post:
      operationId: identity_signup_requests_me_create
      tags:
      - identity-signup-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentitySignupRequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentitySignupRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentitySignupRequestCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySignupRequestSummary'
          description: ''
  /manager-accounts/{manager_account_id}/archive/:
    post:
      operationId: manager_accounts_archive_create
      parameters:
      - in: path
        name: manager_account_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - manager-accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAccountSummary'
          description: ''
  /manager-accounts/{manager_account_id}/change-role/:
    post:
      operationId: manager_accounts_change_role_create
      parameters:
      - in: path
        name: manager_account_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - manager-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerAccountRoleChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManagerAccountRoleChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManagerAccountRoleChange'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAccountSummary'
          description: ''
  /manager-accounts/manage/:
    get:
      operationId: manager_accounts_manage_retrieve
      tags:
      - manager-accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAccountList'
          description: ''
components:
  schemas:
    ActiveAccount:
      type: object
      properties:
        account_type:
          type: string
        account_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
          nullable: true
        role_type:
          type: string
          nullable: true
      required:
      - account_id
      - account_type
    ConsentTypeEnum:
      enum:
      - privacy_policy
      - location_policy
      type: string
      description: |-
        * `privacy_policy` - Privacy Policy
        * `location_policy` - Location Policy
    DriverAccountLinkCreate:
      type: object
      properties:
        driver_account_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
      required:
      - driver_account_id
      - driver_id
    DriverAccountLinkSummary:
      type: object
      properties:
        driver_account_link_id:
          type: string
          format: uuid
          readOnly: true
        driver_account_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        identity_id:
          type: string
          format: uuid
        identity_name:
          type: string
        email:
          type: string
          readOnly: true
        account_status:
          type: string
        linked_at:
          type: string
          format: date-time
          readOnly: true
        unlinked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - account_status
      - driver_account_id
      - driver_account_link_id
      - driver_id
      - email
      - identity_id
      - identity_name
      - linked_at
    DriverAccountList:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/DriverAccountSummary'
      required:
      - accounts
    DriverAccountSummary:
      type: object
      properties:
        driver_account_id:
          type: string
          format: uuid
          readOnly: true
        identity:
          allOf:
          - $ref: '#/components/schemas/IdentitySummary'
          readOnly: true
        company_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/Status244Enum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        active_driver_id:
          type: string
          readOnly: true
      required:
      - active_driver_id
      - company_id
      - created_at
      - driver_account_id
      - identity
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    IdentityAuthSession:
      type: object
      properties:
        access_token:
          type: string
        session_kind:
          type: string
        email:
          type: string
        identity:
          $ref: '#/components/schemas/IdentitySummary'
        active_account:
          allOf:
          - $ref: '#/components/schemas/ActiveAccount'
          nullable: true
        available_account_types:
          type: array
          items:
            type: string
      required:
      - access_token
      - active_account
      - available_account_types
      - email
      - identity
      - session_kind
    IdentityConsentCurrent:
      type: object
      properties:
        privacy_policy_version:
          type: string
          maxLength: 32
        privacy_policy_consented:
          type: boolean
        privacy_policy_consented_at:
          type: string
          format: date-time
        location_policy_version:
          type: string
          maxLength: 32
        location_policy_consented:
          type: boolean
        location_policy_consented_at:
          type: string
          format: date-time
      required:
      - location_policy_consented_at
      - location_policy_version
      - privacy_policy_consented_at
      - privacy_policy_version
    IdentityConsentRecover:
      type: object
      properties:
        privacy_policy_version:
          type: string
          maxLength: 32
        privacy_policy_consented:
          type: boolean
        location_policy_version:
          type: string
          maxLength: 32
        location_policy_consented:
          type: boolean
      required:
      - location_policy_consented
      - location_policy_version
      - privacy_policy_consented
      - privacy_policy_version
    IdentityConsentWithdraw:
      type: object
      properties:
        consent_type:
          $ref: '#/components/schemas/ConsentTypeEnum'
      required:
      - consent_type
    IdentityLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        provider_type:
          $ref: '#/components/schemas/ProviderTypeEnum'
        provider_access_token:
          type: string
          writeOnly: true
    IdentityLoginMethod:
      type: object
      properties:
        identity_login_method_id:
          type: string
          format: uuid
          readOnly: true
        method_type:
          $ref: '#/components/schemas/MethodTypeEnum'
        verified_at:
          type: string
          format: date-time
          nullable: true
        value:
          type: string
          readOnly: true
      required:
      - identity_login_method_id
      - method_type
      - value
    IdentityLoginMethodCreate:
      type: object
      properties:
        method_type:
          $ref: '#/components/schemas/MethodTypeEnum'
        email:
          type: string
          format: email
        phone_number:
          type: string
        provider_type:
          type: string
        provider_subject:
          type: string
        provider_access_token:
          type: string
          writeOnly: true
      required:
      - method_type
    IdentityLoginMethodDelete:
      type: object
      properties:
        confirm:
          type: boolean
          default: false
        current_password:
          type: string
    IdentityLoginMethodList:
      type: object
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/IdentityLoginMethod'
      required:
      - methods
    IdentityPassword:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - new_password
    IdentityProfile:
      type: object
      properties:
        identity_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        birth_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/Status244Enum'
          readOnly: true
      required:
      - birth_date
      - identity_id
      - name
      - status
    IdentityRecovery:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        birth_date:
          type: string
          format: date
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        privacy_policy_version:
          type: string
          maxLength: 32
        privacy_policy_consented:
          type: boolean
        location_policy_version:
          type: string
          maxLength: 32
        location_policy_consented:
          type: boolean
      required:
      - birth_date
      - email
      - location_policy_consented
      - location_policy_version
      - name
      - password
      - privacy_policy_consented
      - privacy_policy_version
    IdentitySignupIntake:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        birth_date:
          type: string
          format: date
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        provider_type:
          $ref: '#/components/schemas/ProviderTypeEnum'
        provider_access_token:
          type: string
          writeOnly: true
        company_id:
          type: string
          format: uuid
        request_types:
          type: array
          items:
            $ref: '#/components/schemas/RequestTypesEnum'
        privacy_policy_version:
          type: string
          maxLength: 32
        privacy_policy_consented:
          type: boolean
        location_policy_version:
          type: string
          maxLength: 32
        location_policy_consented:
          type: boolean
      required:
      - birth_date
      - company_id
      - location_policy_consented
      - location_policy_version
      - name
      - privacy_policy_consented
      - privacy_policy_version
      - request_types
    IdentitySignupIntakeResult:
      type: object
      properties:
        identity_id:
          type: string
          format: uuid
        name:
          type: string
        birth_date:
          type: string
          format: date
        status:
          type: string
        requests:
          type: array
          items:
            $ref: '#/components/schemas/IdentitySignupRequestSummary'
      required:
      - birth_date
      - identity_id
      - name
      - requests
      - status
    IdentitySignupRequestCreate:
      type: object
      properties:
        company_id:
          type: string
          format: uuid
        request_type:
          $ref: '#/components/schemas/RequestTypeEnum'
        is_re_request:
          type: boolean
          default: false
      required:
      - company_id
      - request_type
    IdentitySignupRequestSummary:
      type: object
      properties:
        identity_signup_request_id:
          type: string
          format: uuid
          readOnly: true
        identity:
          allOf:
          - $ref: '#/components/schemas/IdentitySummary'
          readOnly: true
        request_type:
          $ref: '#/components/schemas/RequestTypeEnum'
        request_display_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/IdentitySignupRequestSummaryStatusEnum'
        status_message:
          type: string
          readOnly: true
        company_id:
          type: string
          format: uuid
        requested_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_id
      - identity
      - identity_signup_request_id
      - request_display_name
      - request_type
      - requested_at
      - status_message
    IdentitySignupRequestSummaryStatusEnum:
      enum:
      - pending
      - awaiting_setup
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
