        company_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        system_kind:
          $ref: '#/components/schemas/SystemKindEnum'
        is_in_use:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedDriverDayException:
