components:
  schemas:
    AssignmentStatusEnum:
      enum:
      - assigned
      - unassigned
      type: string
      description: |-
        * `assigned` - assigned
        * `unassigned` - unassigned
    DispatchAssignment:
      type: object
      properties:
        dispatch_assignment_id:
          type: string
          format: uuid
          readOnly: true
        vehicle_schedule_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
          nullable: true
        outsourced_driver_id:
          type: string
          format: uuid
          nullable: true
        operator_company_id:
          type: string
          format: uuid
        dispatch_date:
          type: string
          format: date
        shift_slot:
          type: string
          maxLength: 32
        assignment_status:
          $ref: '#/components/schemas/AssignmentStatusEnum'
        assigned_at:
          type: string
          format: date-time
        unassigned_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_at
      - assignment_status
      - created_at
      - dispatch_assignment_id
      - dispatch_date
      - operator_company_id
      - shift_slot
      - updated_at
      - vehicle_id
      - vehicle_schedule_id
    DispatchPlan:
      type: object
      properties:
        dispatch_plan_id:
          type: string
          format: uuid
          readOnly: true
        company_id:
          type: string
          format: uuid
        fleet_id:
          type: string
          format: uuid
        dispatch_date:
          type: string
          format: date
        planned_volume:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        dispatch_status:
          $ref: '#/components/schemas/DispatchStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_id
      - created_at
      - dispatch_date
      - dispatch_plan_id
      - dispatch_status
      - fleet_id
      - planned_volume
      - updated_at
    DispatchStatusEnum:
      enum:
      - draft
      - published
      - closed
      type: string
      description: |-
        * `draft` - draft
        * `published` - published
        * `closed` - closed
    DispatchWorkRule:
      type: object
      properties:
        work_rule_id:
          type: string
          format: uuid
          readOnly: true
        company_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        system_kind:
          $ref: '#/components/schemas/SystemKindEnum'
        is_in_use:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_id
      - created_at
      - is_in_use
      - name
      - system_kind
      - updated_at
      - work_rule_id
    DriverDayException:
      type: object
      properties:
        driver_day_exception_id:
          type: string
          format: uuid
          readOnly: true
        company_id:
          type: string
          format: uuid
        fleet_id:
          type: string
          format: uuid
        dispatch_date:
          type: string
          format: date
        driver_id:
          type: string
          format: uuid
        work_rule_id:
          type: string
          format: uuid
          writeOnly: true
        work_rule:
          allOf:
          - $ref: '#/components/schemas/DispatchWorkRule'
          readOnly: true
        memo:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_id
      - created_at
      - dispatch_date
      - driver_day_exception_id
      - driver_id
      - fleet_id
      - updated_at
      - work_rule
      - work_rule_id
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    OutsourcedDriver:
      type: object
      properties:
        outsourced_driver_id:
          type: string
          format: uuid
          readOnly: true
        dispatch_plan_id:
          type: string
          format: uuid
        company_id:
          type: string
          readOnly: true
        fleet_id:
          type: string
          readOnly: true
        dispatch_date:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 120
        contact_number:
          type: string
          maxLength: 32
        vehicle_note:
          type: string
          maxLength: 255
        memo:
          type: string
        status:
          type: string
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
        is_archivable:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - company_id
      - contact_number
      - created_at
      - dispatch_date
      - dispatch_plan_id
      - fleet_id
      - is_archivable
      - name
      - outsourced_driver_id
      - status
      - updated_at
    PatchedDispatchAssignment:
      type: object
      properties:
        dispatch_assignment_id:
          type: string
          format: uuid
          readOnly: true
        vehicle_schedule_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
          nullable: true
        outsourced_driver_id:
          type: string
          format: uuid
          nullable: true
        operator_company_id:
          type: string
          format: uuid
        dispatch_date:
          type: string
          format: date
        shift_slot:
          type: string
          maxLength: 32
        assignment_status:
          $ref: '#/components/schemas/AssignmentStatusEnum'
        assigned_at:
          type: string
          format: date-time
        unassigned_at:
          type: string
          format: date-time
